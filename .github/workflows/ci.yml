name: CI

on:
  push:
    branches: [main]
  # No branch filter: stacked PRs target a parent feature branch rather than main, and a
  # `branches: [main]` filter silently skipped CI on those entirely. The green check they
  # showed came from whichever run happened to share the head SHA.
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build